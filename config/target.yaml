channel: target
bq:
  project: biom-reporting-s26
  location: us-central1
  max_bytes_billed: 2147483648
  basis: operational choice, not measured
calendar:
  week_anchor: sunday
  fiscal_year_start:
    value: 2026-02-01
    basis: assumed, confirm with buyer
  ship_window_days:
    value: 1
    basis: 'measured 2026-09-03: revised_ship_end_d - revised_ship_begin_d = 1 day
      on replenishment lines'
item_groups:
  D3-C2:
    name: cleaning
    department_id: 3
    class_id: 2
    po_day: sunday
    ship_offset_days: 5
    basis: 'measured 2026-09-03: replenishment PO created Sunday; revised_ship_begin_d
      = create + 5 d (Friday)'
  D253-C4:
    name: personal care
    department_id: 253
    class_id: 4
    po_day: monday
    ship_offset_days: 5
    basis: 'measured 2026-09-03: replenishment PO created Monday; revised_ship_begin_d
      = create + 5 d (Saturday)'
  D253-C6:
    name: flushables
    department_id: 253
    class_id: 6
    po_day: monday
    ship_offset_days: 5
    basis: 'measured 2026-09-08 on bpd_raw: PO plan ORDER_D is Monday in all 74 snapshots
      for TCINs 95285660/95285661/95285662 (launch 2026-10-11); the one replenishment PO
      created so far (10002045523, Mon 24 Aug) had ship_begin +5 d (Sat 29 Aug); the
      launch PO 10002007019 was created Thu 30 Jul for a 18-19 Sep ship window'
  D7:
    name: baby
    department_id: 7
    class_id: null
    po_day: monday
    ship_offset_days: 7
    basis: 'measured 2026-09-03: replenishment PO created Monday; revised_ship_begin_d
      = create + 7 d (Monday)'
dc_transit_days:
  default:
    days: 12
    basis: operational choice, not measured (remaining DCs observed at 9-15 d on 2026-09-03;
      12 is the midpoint)
  overrides:
  - dcs:
    - 553
    - 555
    - 593
    - 3806
    - 3856
    - 588
    days: 5
    basis: 'measured 2026-09-03: revised_estimated_arrival_d - revised_ship_begin_d
      on replenishment lines (CA DCs)'
  - dcs:
    - 551
    - 579
    - 3802
    days: 16
    basis: 'measured 2026-09-03: revised_estimated_arrival_d - revised_ship_begin_d
      on replenishment lines'
streams:
  forward_threshold_days:
    value: 14
    basis: 'measured 2026-09-03: replenishment lines have revised_ship_begin_d - purchase_order_create_d
      <= 14 d; the 17 forward/launch POs (272,682 units, 34%) all exceed it'
  lapsed_grace_days:
    value: 7
    basis: operational choice, not measured
  planned_forward_multiple:
    value: 3.0
    basis: operational choice, not measured (plan spikes of 71k-98k vs ~20-25k normal
      weeks on 2026-09-03 exceed 3x)
grades:
  by_lead_days:
    A:
      min: 0
      max: 1
    B:
      min: 2
      max: 3
    C:
      min: 4
      max: null
  basis: 'measured 2026-09-04: plan-anchor WAPE by lead days 0 -> 0.123, 1 -> 0.180,
    2 -> 0.251, 3 -> 0.305, 4 -> 0.416, 5-10 -> 0.54-0.62; bias -1%'
  labels:
    A:
      label: high
      band_pct: 0.15
      meaning: Target's own plan, 0-1 days old; measured error 12-18%
      basis: measured 2026-09-04
    B:
      label: good
      band_pct: 0.3
      meaning: Target's plan 2-3 days old, or a month >= 75% covered by plan weeks;
        measured error 25-31%
      basis: measured 2026-09-04
    C:
      label: directional
      band_pct: 0.5
      meaning: plan 4+ days old, or consumption model within 6 months; measured weekly
        error 42-62%, monthly unmeasured
      basis: measured 2026-09-04 (weekly); assumed for monthly until backtested
    D:
      label: plan-based
      band_pct: 0.7
      meaning: beyond Target's plan and 6+ months out, or owner-forecast-only items;
        band assumed
      basis: operational choice, not measured
    E:
      label: indicative
      band_pct: 1.0
      meaning: beyond 12 months, or no history at all; direction only
      basis: operational choice, not measured
consumption:
  steady_state_wos_band:
    low: 5
    high: 10
    basis: 'measured Jun-Aug 2026: chain weeks-of-supply band for fast movers'
  dfe_pos_ratio:
    low: 1.1
    high: 1.4
    basis: 'measured Jun-Jul 2026: DFE / POS ratio; the DFE feed has been stale since
      2026-07-27'
  trailing_pos_weeks:
    value: 8
    basis: operational choice, not measured
  receipt_lag_weeks:
    value: 3
    basis: 'measured 2026-09-03: PO create -> receipt median 23 d (p5 13, p95 38)'
  dfe_max_age_days:
    value: 21
    basis: operational choice, not measured
  controller:
    band: 8
    k: 12
    basis: 'measured 2026-09-04 on 252 TCIN-weeks Jun 7-Aug 23: weekly-order WAPE
      0.685, bias -7%; recalibrated by grid search every run'
  pos_candidate_default_weights:
    runrate_8wk: 0.7
    owner_velocity: 0.3
    basis: 'measured 2026-09-04 on Jul-Aug 2026 monthly POS: run-rate WAPE 0.217 bias
      -13%, owner velocity WAPE 0.286 bias -15%; 0.3 owner minimises WAPE (0.214);
      re-weighted 1/WAPE^2 every run'
  calibration_min_week:
    value: '2026-06-07'
    basis: 'measured 2026-09-03: launch pipeline-fill weeks 2026-04-26..05-17 ran
      36-64k units vs 22.5k steady state; calibration starts after them'
gate:
  max_abs_bias:
    value: 0.15
    basis: operational choice, not measured
  bootstrap:
    n_boot: 1000
    alpha: 0.2
    basis: operational choice, not measured
intervals:
  min_pool_rows:
    value: 100
    basis: operational choice, not measured
  log_offset_c:
    value: 1.0
    basis: operational choice, not measured
freshness:
  stale_plan_days:
    value: 4
    basis: operational choice, not measured
  rdz_stale_days:
    value: 7
    basis: operational choice, not measured
supply:
  inbound_confidence_counted:
  - dated
  inbound_lead_buffer_days:
    value: 3
    basis: operational choice, not measured
horizon:
  po_weeks: 16
  months: 16
  basis: operational choice, not measured (owner sheet runs to Dec-2028; grades D/E
    beyond 6/12 months)
