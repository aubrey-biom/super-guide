# shipcast -- workbook layout for the Target channel.
#
# Edit this file to change what the workbook looks like. Each entry under
# `sheets` becomes one sheet, in order. Kinds:
#   readme  key/value block from the run metadata (+ optional appended frames)
#   long    one table: pick `columns`, relabel with `labels`, `sort`, `filter`
#   wide    a pivot: `index` rows x `column_from` columns holding `value`;
#           `companion` grids (e.g. the grade per cell) are stacked underneath
#   blocks  several long tables stacked on one sheet (Accuracy)
# Frame keys come from shipcast.pipeline.ForecastBundle.frames.

workbook:
  filename: "target_shipment_forecast_{as_of}.xlsx"
  also_write_csv: true

sheets:
  - name: README
    kind: readme
    title: "Target shipment forecast — run metadata"
    append_frames: [legend]
    append_titles:
      legend: "Confidence legend (grade -> expected error band)"

  - name: Monthly
    kind: wide
    title: "Expected shipments to Target by month (units, all streams). Grade, provenance and band grids below. Months the engine cannot measure and only the B&M store plan describes are carried at grade E with provenance stated_only."
    source: monthly
    index: [sku, tcin, description]
    column_from: month_start
    column_format: "%b-%y"
    value: expected_ship_units
    agg: sum
    limit_columns: 28
    number_format: "#,##0"
    total_row: true
    companion:
      - title: "Confidence grade per cell (A high … E indicative; see README legend)"
        value: grade
        agg: worst
      - title: "Provenance per cell: measured (BPD only) | measured_shaped_by_plan (BPD level, B&M store ramp) | stated_only (B&M sheet alone, no BPD signal). Weakest stream in the month wins."
        value: authority
        agg: provenance
      - title: "Low end of band (units)"
        value: low
        agg: sum
        number_format: "#,##0"
      - title: "High end of band (units)"
        value: high
        agg: sum
        number_format: "#,##0"

  - name: Monthly detail
    kind: long
    title: "One row per SKU x month x stream — everything behind the Monthly grid. 'Expected PO units (create month)' and 'Expected shipments (units)' are the same weekly orders bucketed by two different dates, NOT one plus the other: create_month = ship_month - carried in + carried out (see README po_units_vs_shipments)"
    source: monthly
    sort: [tcin, month_start, stream]
    columns: [sku, tcin, description, item_group, month, stream, authority, expected_ship_units, low, high, grade, confidence,
              expected_po_units, pos_units, pos_units_bpd, upspw, stores_fwd, stores_source, bm_stores, bm_ramp, ramp_flag,
              season_factor, drawdown_release,
              on_hand_start, on_hand_end, wos_end, order_to_sales,
              source_mix, pos_candidates, step_up_month, flags]
    labels:
      authority: "Provenance"
      expected_ship_units: "Expected shipments (units)"
      expected_po_units: "Expected PO units (create month)"
      pos_units: "POS forecast (units)"
      pos_units_bpd: "POS forecast before store ramp (units)"
      upspw: "Units per selling store per week"
      stores_fwd: "Projected selling stores"
      stores_source: "Store count set by (bpd_trend | bm_plan)"
      bm_stores: "B&M sheet stores"
      bm_ramp: "B&M store ramp (ratio to anchor month)"
      ramp_flag: "Ramp refusal"
      season_factor: "Month-of-year factor"
      drawdown_release: "Inventory change released (units)"
      on_hand_start: "Target on-hand, month start"
      on_hand_end: "Target on-hand, month end"
      wos_end: "Weeks of supply, month end"
      order_to_sales: "Orders / sales"
      source_mix: "Weeks from plan vs model"
      pos_candidates: "POS estimator"
      step_up_month: "Step-up"

  - name: Shipments weekly
    kind: wide
    title: "Expected shipments by ship week (cases). Replenishment forecast + booked launch POs."
    source: shipments
    index: [sku, tcin, description, stream]
    column_from: ship_week
    column_format: "%d %b"
    value: cases
    agg: sum
    number_format: "#,##0.0"
    total_row: true
    companion:
      - title: "Units"
        value: units
        agg: sum
        number_format: "#,##0"
      - title: "Confidence grade"
        value: grade
        agg: worst

  - name: Weekly detail
    kind: long
    title: "Plan-anchored weekly forecast, one row per TCIN x PO week"
    source: weekly
    sort: [po_week, tcin]
    columns: [po_week_label, fiscal_week, ship_week, sku, tcin, description, item_group, stream, expected_po_units,
              expected_cases, low, high, grade, confidence, lead_days, plan_business_d, primary_signal, fallback_rung,
              flags, lag1_rep, mean4_rep, n_dc, casepack]
    labels:
      po_week_label: "PO week (Sunday)"
      expected_po_units: "Expected PO units"
      expected_cases: "Cases"
      plan_business_d: "Plan file date"
      lead_days: "Plan lead (days)"
      lag1_rep: "Last week actual"
      mean4_rep: "4-week mean actual"

  - name: Accuracy
    kind: blocks
    blocks:
      - source: accuracy_signals_h1
        title: "Signals one week ahead (horizon 1 only). n = all TCIN-weeks in the panel; n_scored = rows where forecast or actual is non-zero (the population the share columns and the Block 4 bands use). WAPE with 80% week-block bootstrap interval (bootstrap_draws resamples of whole weeks), bias, admission (beats naive AND |bias| < 15%)"
        columns: [signal, n, n_scored, wape, wape_lo80, wape_hi80, bias, median_ape, exact_share, within_10_share, admitted_weekly, bootstrap_draws]
      - source: accuracy_plan_by_lead
        title: "Target PO plan accuracy by lead days, HORIZON 1 ONLY (basis of the A/B/C grades). One lead value appears because the panel is built as-of the Saturday before each PO week, so horizon 1 is always lead 1 — leads 0, 2 and 3 cannot occur in it. n_scored here IS Block 4's bucket-A n: same rows, two counts"
        columns: [lead_days, n, n_scored, wape, bias, median_ape, exact_share, within_10_share]
      - source: accuracy_horizon
        title: "Plan accuracy by horizon (weeks ahead). Block 4 pools these three horizons, so its bucket n values sum from this block's n_scored, not from Block 2"
        columns: [horizon, n, n_scored, wape, bias, exact_share, within_10_share]
      - source: accuracy_bands
        title: "Prediction bands: log-ratio quantiles per lead bucket, POOLED OVER HORIZONS 1-3, and leave-one-week-out realised coverage of the P10-P90 band. n counts informative rows only (forecast or actual non-zero) — bucket A = Block 2's n_scored (horizon 1, lead 1); bucket C = horizons 2 and 3 (the same Saturday file at lead 8 and 15); bucket B is empty by panel construction, not for want of data, so it borrows the pooled quantiles"
        columns: [bucket, n, q_lo, q_hi, pooled, coverage]
      - source: accuracy_pos_candidates
        title: "Monthly POS estimators vs actual POS, leak-free rolling origin. EVIDENCE, NOT WEIGHTS — the run publishes the one marked `used` (dist_velocity) and there is no blend: the two estimators' errors correlate 0.686, so 1/WAPE^2 weighting scored 0.2035 against dist_velocity's 0.1998, i.e. worse than the single candidate. runrate_8wk is printed as the reference it is"
        columns: [candidate, n, wape, bias, median_ape, used, basis]
      - source: accuracy_season_index
        title: "Month-of-year index on distribution-normalised UPSPW (a moving seasonal index). A month is APPLIED only on n >= season_min_obs observations AND n_years >= season_min_years distinct calendar years — a month seen in one year only has an index inseparable from that year's trend, and BIOM's Target distribution grew ~20x over the 20 months bpd_raw holds. Where `applied` is FALSE the factor used is exactly 1.000"
        columns: [month_of_year, n, n_tcin, n_years, raw_index, shrunk_index, applied]
      - source: accuracy_controller
        title: "Inventory drawdown controller (calibrated each run)"
        columns: [parameter, value]
      - source: accuracy_controller_grid
        title: "Controller grid (best 15 by WAPE + |bias|)"
        columns: [band, k, wape, bias, objective]

  - name: Booked forward
    kind: long
    title: "Open launch / forward PO lines already created by Target, placed at ship week"
    source: booked_forward
    sort: [ship_week, tcin]
    columns: [sku, tcin, description, purchase_order_id, ship_begin_d, ship_week, receipt_week, units, casepack]

  - name: Store plan check
    kind: long
    title: "B&M sheet store plan vs BPD, per TCIN. The sheet's anchor-month Stores (a door count) against BPD's stocked stores in the latest week (gap = (sheet - BPD) / BPD; the selling-store count dist_velocity uses is printed beside it, and is lower by construction), and the ramp the engine actually applied. The ramp is read from max(sheet anchor, BPD stocked), so a sheet that understates today's doors does not turn that into growth (BM_RAMP_ANCHOR_FROM_BPD). Other flags name a refusal: no anchor, placeholder block, or capped."
    source: bm_store_check
    sort: [sku]
    columns: [sku, tcin, bm_stores_anchor, bpd_stocked_stores, stores_gap_pct, bpd_selling_stores, bm_stores_anchor_used, bm_upspw, bpd_upspw,
              bm_stores_plan_peak, bm_peak_month, bm_ramp_to_peak, ramp_distinct_values, ramp_flag]
    labels:
      bm_stores_anchor: "B&M stores, anchor month"
      bpd_stocked_stores: "BPD stocked stores, latest week"
      stores_gap_pct: "Store gap (sheet vs BPD stocked)"
      bpd_selling_stores: "BPD selling stores, anchor month"
      bm_stores_anchor_used: "Ramp denominator (max of sheet anchor, BPD stocked)"
      bm_upspw: "B&M UPSPW"
      bpd_upspw: "BPD UPSPW"
      bm_stores_plan_peak: "B&M stores at plan peak"
      bm_peak_month: "Plan peak month"
      bm_ramp_to_peak: "Ramp to peak"
      ramp_distinct_values: "Distinct ramp values"
      ramp_flag: "Ramp refusal"

  - name: Load order check
    kind: long
    title: "B&M Load_Orders vs what the engine already carries (booked forward + planned forward + planned launch), per TCIN over the months both cover. A cross-check only: the sheet's Load_Orders never moves a unit. verdict BM_LOAD_AGREES within load_tolerance; otherwise the gap and the months each side names. For a pre-launch item the engine's planned_launch carries Target's WHOLE plan while the sheet splits fill (Load_Orders) from run-rate (Velocity): compare the engine figure with Load_Orders + Velocity there."
    source: bm_load_check
    sort: [verdict, tcin]
    columns: [bm_sku, tcin, bm_load_units, bm_velocity_units, bpd_load_units, gap_pct, bm_months, bpd_months, verdict, note]
    labels:
      bm_sku: "B&M SKU"
      bm_load_units: "B&M Load_Orders (units)"
      bm_velocity_units: "B&M Velocity, same months (units)"
      bpd_load_units: "Engine launch/forward units"
      gap_pct: "Gap (sheet vs engine)"
      bm_months: "Months named by sheet"
      bpd_months: "Months named by engine"

  - name: Coverage
    kind: long
    title: "Which TCINs the B&M sheet, the item master and this run each cover. A SKU the sheet names but the item master cannot resolve is reported here and never guessed."
    source: bm_coverage
    sort: [in_run, sku]
    columns: [sku, tcin, item_state, in_bm_sheet, in_item_master, in_run, note]

  - name: Exceptions
    kind: long
    title: "Items and inputs that need a human eye. Nothing is silently dropped."
    source: exceptions
    columns: [tcin, sku, issue, detail]
